name: CI deploy

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Clonar el repositorio
        uses: actions/checkout@v4

      - name: ⬢ Instalar PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 12 # Reemplaza por tu versión mayor de pnpm si es necesario

      - name: 🏗️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: 📥 Instalar dependencias locales
        run: pnpm install --frozen-lockfile

      - name: 🎨 Validar formato y calidad de código (Lint)
        run: pnpm run lint

      - name: ⚙️ Sincronizar tipos y validar TypeScript
        run: pnpm run check

      - name: 🧪 Ejecutar pruebas unitarias (Vitest)
        run: pnpm vitest run

      - name: 🚀 Compilar aplicación (Build Test)
        run: pnpm run build
