name: CI deploy
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Clonar el repositorio
        uses: actions/checkout@v4
      - name: 🏗️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 📦 Instalar PNPM de forma global
        run: npm install -g pnpm
      - name: 🗄️ Cachear dependencias de PNPM
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: runner.os -pnpm-store-{{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            \${{ runner.os }}-pnpm-store-
      - name: 📥 Instalar dependencias locales
        run: pnpm install --frozen-lockfile
      - name: 🎨 Validar formato y calidad de código (Lint)
        run: pnpm run lint
      - name: ⚙️ Sincronizar tipos y validar TypeScript
        run: pnpm run check
      - name: 🧪 Ejecutar pruebas unitarias (Vitest)
        run: pnpm vitest run
      - name: 🚀 Compilar aplicación (Build Test)
        run: pnpm run build
